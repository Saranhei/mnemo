# Definición del proyecto de Xcode para XcodeGen (https://github.com/yonaskolb/XcodeGen).
# El script scripts/build.sh genera Mnemo.xcodeproj a partir de este archivo,
# así no hay que crear ni configurar el proyecto a mano.
# Mnemo.xcodeproj es un archivo generado: no se sube a git.

name: Mnemo

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

targets:
  Mnemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Mnemo
    # Team ID, bundle id e iCloud salen de acá (y de Local.xcconfig, que no se sube).
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    info:
      path: Mnemo/Resources/Info.plist
      properties:
        # CloudKit avisa con notificaciones silenciosas que hay cambios en otro dispositivo.
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mnemo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - MnemoTests

  MnemoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MnemoTests
    dependencies:
      - target: Mnemo
    configFiles:
      Debug: Config/Tests.xcconfig
      Release: Config/Tests.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mnemo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mnemo"
        BUNDLE_LOADER: "$(TEST_HOST)"
